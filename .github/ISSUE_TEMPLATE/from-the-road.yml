name: From the road
description: Send a Manafall picture or clip. Jean-Luc reviews it before it goes on the site.
title: "[From the road] "
labels: ["from-the-road"]
body:
  - type: markdown
    attributes:
      value: |
        This does **not** go on the public page until Jean-Luc accepts it.
        Paste https links, or drop screenshots into the box after this form opens.
  - type: input
    id: player_name
    attributes:
      label: Your name
      description: Shown under the picture.
      placeholder: Traveler
    validations:
      required: true
  - type: textarea
    id: caption
    attributes:
      label: What happened
      description: A short caption. Say what we are looking at.
      placeholder: Built a yurt by the swamp after the nightling fight.
    validations:
      required: true
  - type: textarea
    id: links
    attributes:
      label: Picture or video links
      description: One https link per line. YouTube, Imgur, or images you paste into GitHub all work.
      placeholder: https://youtu.be/...
    validations:
      required: true
